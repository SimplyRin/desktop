name: CI

on:
  push:
    branches:
      - release-linux
  pull_request:
    branches:
      - release-linux
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to check out (defaults to this repository)
        required: false
        type: string
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: release-linux
        type: string
      environment:
        description: Release channel
        required: true
        default: development
        type: choice
        options:
          - development
          - test
          - beta
          - production
      upload-artifacts:
        description: Upload the packaged Linux application
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        default: release-linux
        required: false
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        required: true
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false

env:
  NODE_VERSION: 24.15.0
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  build-linux:
    name: Ubuntu x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment || 'development' }}
      npm_config_arch: x64
      TARGET_ARCH: x64
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install Linux build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64

      - name: Validate Electron version
        run: yarn validate-electron-version

      - name: Lint
        run: yarn lint

      - name: Validate changelog
        run: yarn validate-changelog

      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code

      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test

      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_E2E_UPDATES_URL: http://127.0.0.1:51789/update

      - name: Prepare testing environment
        run: yarn test:setup

      - name: Run unit tests
        run: yarn test:unit

      - name: Run script tests
        run: yarn test:script

      - name: Package production app
        run: yarn package

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        if: ${{ inputs.upload-artifacts }}
        with:
          name: Ubuntu-x64
          path: |
            dist/GitHubDesktop-linux-x64.tar.gz
            dist/GitHubDesktop-linux-x64.deb
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error

      - name: Configure packaged app path
        run: |
          echo "DESKTOP_E2E_APP_PATH=$PWD/dist/desktop-linux-x64/desktop" >> "$GITHUB_ENV"

      - name: Validate packaged executable
        run: |
          test -x "$DESKTOP_E2E_APP_PATH"
          ldd "$DESKTOP_E2E_APP_PATH"

      - name: Run packaged E2E smoke tests
        run: xvfb-run --auto-servernum yarn test:e2e:run:packaged
        env:
          DEBUG: pw:browser*

      - name: Upload E2E artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-Ubuntu-x64
          path: playwright-videos/**
          if-no-files-found: warn
