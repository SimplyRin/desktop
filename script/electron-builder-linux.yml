artifactName: 'GitPeachDesktop-${os}-${arch}-${version}.${ext}'
directories:
  output: 'dist'
linux:
  # Written verbatim into Categories= of the generated desktop entry. GNOME and
  # GTK are reserved categories - desktop-file-validate rejects an entry that
  # uses them without a matching OnlyShowIn - so stick to registered ones.
  category: 'Development;RevisionControl'
  icon: 'app/static/linux/logos'
  # Without this the deb ends up with an empty first line in its Description,
  # which is where the short summary belongs.
  synopsis: 'Simple collaboration from your desktop'
  mimeTypes:
    - x-scheme-handler/x-github-client
    - x-scheme-handler/x-gitpeach-desktop-auth
    # workaround for handling OAuth flow until we figure out what we're doing
    # With the development OAuth details
    # see https://github.com/shiftkey/desktop/issues/72 for more details
    - x-scheme-handler/x-gitpeach-desktop-dev-auth
  # Extra keys merged into the desktop entry electron-builder generates. This
  # is the only way to get them in: `extraFiles` copies into the *app*
  # directory (/opt/GitPeach Desktop), never into the package root, and is
  # skipped outright when packaging from --prepackaged, which is how this repo
  # builds. The desktop file and icon copies that used to live here therefore
  # never reached /usr/share at all.
  #
  # The icons come from `icon` above - electron-builder installs every PNG in
  # that directory as /usr/share/icons/hicolor/<size>/apps/<executableName>.png
  # and points Icon= at <executableName>.
  #
  # Categories cannot be set here; it is overwritten from `category` after
  # these keys are merged.
  desktop:
    GenericName: 'Git Client'
    Keywords: 'git;github;gitpeach;version control;development;repository;'
    StartupNotify: 'true'
    X-GNOME-SingleWindow: 'true'
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  maintainer: 'SimplyRin <contact@simplyrin.net>'
  executableName: 'gitpeach-desktop'

deb:
  depends:
    - git
    - libsecret-1-0
    - libxss1
    - libnss3
    - libasound2t64 | libasound2
    - zlib1g
    - libbz2-1.0
    - liblzma5
    - desktop-file-utils
    - shared-mime-info
  afterInstall: 'script/linux-after-install.sh'
  afterRemove: 'script/linux-after-remove.sh'
  # Debian archive section - not a desktop menu category. The menu categories
  # are linux.category above.
  packageCategory: 'devel'
  fpm:
    - '--deb-recommends=xdg-utils'

rpm:
  depends:
    - git
    - libsecret
    - libXScrnSaver
    - nss
    - alsa-lib
    - zlib
    - bzip2-libs
    - xz-libs
  afterInstall: 'script/linux-after-install.sh'
  afterRemove: 'script/linux-after-remove.sh'
  packageCategory: 'Development/Tools'
